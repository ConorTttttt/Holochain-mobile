[package]
name = "h2hc-bench"
description = "Local test network and benchmarks for the H2HC phone conductor"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1"
base64 = "0.22"
ed25519-dalek.workspace = true
h2hc-conductor = { path = "../h2hc-conductor" }
holochain = { workspace = true, features = ["wasmer-sys-cranelift"] }
rand.workspace = true
serde.workspace = true
serde_json.workspace = true
sodoken = "0.1"
tokio = { workspace = true, features = ["io-util", "net", "process"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url2 = "0.0.6"
