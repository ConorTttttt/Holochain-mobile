[package]
name = "h2hc-p2p"
description = "HcP2p implementation that reaches the network through an H2HC linker instead of a local Kitsune2"
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
# Must be on whenever anything in the build enables `holochain_p2p/test_utils`,
# because that feature adds `HcP2p::test_kitsune`.
test_utils = ["holochain_p2p/test_utils"]

[dependencies]
futures.workspace = true
h2hc-protocol.workspace = true
holochain_keystore.workspace = true
holochain_p2p.workspace = true
holochain_state.workspace = true
holochain_types.workspace = true
kitsune2_api.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
ed25519-dalek.workspace = true
rand.workspace = true
