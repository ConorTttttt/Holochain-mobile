[workspace]
resolver = "2"
exclude = ["tests/fixtures", "prototypes/h2hc-linker"]
members = [
    "prototypes/h2hc-protocol",
    "prototypes/h2hc-p2p",
    "prototypes/h2hc-conductor",
    "prototypes/h2hc-bench",
    "prototypes/turbo-kart-android-native",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
publish = false

[workspace.dependencies]
h2hc-protocol = { path = "prototypes/h2hc-protocol" }
h2hc-p2p = { path = "prototypes/h2hc-p2p" }

# Holochain is pinned to the release the compatibility matrix was checked against.
# Engine features are chosen per package: Holochain 0.7.1 cannot run wasmi
# when wasmer-sys is also compiled in (it reads wasmer's metering global).
holochain = { version = "=0.7.1", default-features = false, features = ["encryption"] }
holochain_types = "=0.7.1"
holochain_p2p = "=0.7.1"
holochain_state = "=0.7.1"
holochain_keystore = "=0.7.1"
kitsune2_api = "0.5.2"

ed25519-dalek = { version = "2.2", features = ["rand_core"] }
futures = "0.3"
rand = "0.8"
rmp-serde = "1.3"
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
serde_json = "1"
thiserror = "2"
tokio = { version = "1.52", features = ["macros", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = "0.27"
tracing = "0.1"

# Adds ConductorBuilder::with_p2p_factory. Run scripts/vendor-holochain.sh to
# create vendor/; the change itself is patches/holochain-0.7.1-p2p-factory.patch.
[patch.crates-io]
holochain = { path = "vendor/holochain-0.7.1" }
# Frees wasmi stores when they are dropped:
# patches/wasmer-7.1.0-wasmi-store-ownership.patch.
wasmer = { path = "vendor/wasmer-7.1.0" }
